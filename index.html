<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>XrossStarsDataPortal</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    #portrait-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #111;
      color: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      text-align: center;
      gap: 24px;
    }
    #portrait-overlay.visible {
      display: flex;
    }
    #portrait-overlay svg {
      width: 80px;
      height: 80px;
      animation: rotate-hint 1.5s ease-in-out infinite alternate;
    }
    @keyframes rotate-hint {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-90deg); }
    }
    #portrait-overlay p {
      font-size: 1.2rem;
      margin: 0;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <!-- 縦向き警告オーバーレイ -->
  <div id="portrait-overlay">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <line x1="12" y1="18" x2="12" y2="18.01"/>
      <!-- 回転矢印 -->
      <path d="M17 8 A6 6 0 0 0 7 12" stroke="white" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <defs>
        <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="white"/>
        </marker>
      </defs>
    </svg>
    <p>横向きにして<br>ご利用ください</p>
  </div>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=1600 height=900 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">XrossStarsDataPortal</div>
    </div>
  </div>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var warningBanner = document.querySelector("#unity-warning");
    var overlay = document.getElementById("portrait-overlay");

    // 縦向き検知
    function checkOrientation() {
      var isPortrait = window.innerHeight > window.innerWidth;
      if (isPortrait) {
        overlay.classList.add("visible");
      } else {
        overlay.classList.remove("visible");
      }
    }

    window.addEventListener("resize", checkOrientation);
    window.addEventListener("orientationchange", function () {
      // orientationchange 直後は innerWidth/Height が未確定なので少し待つ
      setTimeout(checkOrientation, 100);
    });
    checkOrientation();

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? "block" : "none";
      }
      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type === "error") div.style = "background: red; padding: 10px;";
      else {
        if (type === "warning") div.style = "background: yellow; padding: 10px;";
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/7a2dbded24d57e056180125b1583e7c4.loader.js";
    var config = {
      dataUrl: buildUrl + "/3044e33431f05310c08f0bd4b7939a63.data",
      frameworkUrl: buildUrl + "/1c989c667b38813790945a02aefe63b6.framework.js",
      codeUrl: buildUrl + "/5fa4b06cb50c252f0125b34c63b6974e.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "XrossStarsDataPortal",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no";
      document.getElementsByTagName("head")[0].appendChild(meta);
      container.className = "unity-mobile";
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    } else {
      canvas.style.width = "1600px";
      canvas.style.height = "900px";
    }

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = 100 * progress + "%";
      }).then(function (unityInstance) {
        loadingBar.style.display = "none";
        fullscreenButton.onclick = function () {
          document.makeFullscreen('unity-container');
        };
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
